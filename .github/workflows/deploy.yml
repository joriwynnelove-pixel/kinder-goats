# Builds the site and publishes it to GitHub Pages.
#
# Runs only when something is saved (every save in the web editor is a push to
# main) or when started by hand from the Actions tab. There is deliberately no
# timed schedule: GitHub switches scheduled jobs off after 60 days without
# activity, and this site must keep working untouched.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two saves happen close together, finish the newest one only.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Works out the site's address, e.g. https://name.github.io/herd
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # Keep JPEG copies of iPhone (HEIC) photos between builds so only new
      # photos are converted (see lib/heic.js)
      - uses: actions/cache@v6
        with:
          path: src/images/_converted
          key: heic-${{ hashFiles('src/images/**/*.heic', 'src/images/**/*.HEIC', 'src/images/**/*.heif', 'src/images/**/*.HEIF') }}
          restore-keys: heic-

      - run: npm test

      - name: Build
        run: npx @11ty/eleventy --pathprefix="${{ steps.pages.outputs.base_path }}/"
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
